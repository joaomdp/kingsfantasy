
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Lendas Fantasy | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c89b3c;
            --gold-bright: #f0e6d2;
            --hex-blue: #0ac8b9;
            --bg-deep: #020202;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: #f0f0f0;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Camada 1: Halftone Degrade (O efeito pontilhado que desvanece) */
        .bg-pattern-halftone {
            position: fixed;
            inset: 0;
            /* Pontos brancos bem pequenos e sutis */
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
            background-size: 18px 18px;
            /* Máscara que cria o degrade: 100% visível no topo, sumindo até os 60% da tela */
            mask-image: linear-gradient(to bottom, black 0%, rgba(0,0,0,0.5) 30%, transparent 70%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, rgba(0,0,0,0.5) 30%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Camada 2: Micro-Grid de Apoio (Tech Blueprint) */
        .bg-pattern-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 90px 90px;
            mask-image: radial-gradient(circle at top center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at top center, black, transparent 80%);
            pointer-events: none;
            z-index: 2;
        }

        /* Camada 3: Textura de Grão Suave */
        .bg-noise {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.025;
            pointer-events: none;
            z-index: 3;
        }

        /* Camada 4: Glows Atmosféricos e Vinheta */
        .bg-glows {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(200, 155, 60, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 0% 100%, rgba(10, 200, 185, 0.04) 0%, transparent 40%);
            pointer-events: none;
            z-index: 4;
        }

        /* Vinheta nas bordas para focar no centro */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 5;
        }
        
        #root {
            position: relative;
            z-index: 10;
        }
        
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism Ultra-Refinado */
        .glass-card {
            background: rgba(8, 8, 8, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.9);
        }
        
        /* Scrollbar Invisível/Elegante */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: rgba(200, 155, 60, 0.15); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(15px); filter: blur(8px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .page-transition-container {
            animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div class="bg-pattern-halftone"></div>
    <div class="bg-pattern-grid"></div>
    <div class="bg-noise"></div>
    <div class="bg-glows"></div>
    <div id="root"></div>
</body>
</html>
