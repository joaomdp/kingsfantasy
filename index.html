
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kings Lendas Fantasy | Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c89b3c;
            --gold-bright: #f0e6d2;
            --hex-blue: #0ac8b9;
            --bg-deep: #020202;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: #f0f0f0;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(200, 155, 60, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(10, 200, 185, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }
        
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism Refinado */
        .glass-card {
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        
        /* Scrollbar Stealth */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { 
            background: #222; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        /* Animação simplificada para não quebrar position: fixed */
        @keyframes pageEnter {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .page-transition-container {
            animation: pageEnter 0.4s ease-out forwards;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(200, 155, 60, 0.05), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        @keyframes shine {
            100% { left: 125%; }
        }
        .hover-shine {
            position: relative;
        }
        .hover-shine::after {
            content: "";
            position: absolute;
            top: 0;
            left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-25deg);
            transition: none;
            z-index: 1;
            pointer-events: none;
        }
        .hover-shine:hover::after {
            animation: shine 0.75s ease-in-out;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{

    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
